[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathguard-mcp"
version = "0.1.0"
description = "PathGuard MCP server | lets AI agents check crypto transactions for scams and mistakes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]
authors = [
    { name = "Ciel Tech Ltd" }
]

[project.scripts]
pathguard-mcp = "pathguard_mcp.server:main"

[project.urls]
Homepage = "https://pathguard.cieltech.org"